<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out">RUNNING</pre><script>
function getText(u){const x=new XMLHttpRequest();x.open('GET',u,false);x.send();return x.responseText;}
const P = new URLSearchParams(location.search);
const SRC_FILES = P.get('src')
  ? P.get('src').split(',')
  : [
      '../src/geometry/polygon_2d.js',
      '../src/geometry/obb_medial_2d.js',
      '../src/geometry/marching_squares_2d.js',
      '../src/mesh/mesh_primitives.js',
      '../src/mesh/mesh_clipper_3d.js',
      '../src/mesh/roof_shapes.js',
      '../src/mesh/roof_architectural.js',
      '../src/mesh/terrain_dem_grid.js',
      '../src/mesh/mesh_tile_append.js',
      '../src/mesh/water_masks.js',
      '../src/mesh/features_greenery.js',
      '../src/mesh/features_roads.js',
      '../src/mesh/features_trees.js',
      '../src/mesh/terrain_masks.js',
      '../src/mesh/features_water.js',
      '../src/mesh/terrain_base_water.js',
      '../src/mesh/features_roads_parks.js',
      '../src/mesh/features_bridges.js',
      '../src/mesh/buildings_prepare.js',
      '../src/mesh/buildings_s3db.js',
      '../src/mesh/mesh_topology.js',
      '../src/mesh/mesh_builder.js'
    ];
let src = SRC_FILES.map(getText).join('\n');
const targetKeyhole = "  let ring = holesClean.length > 0 ? mergeHolesIntoOuterKeyhole(outerClean, holesClean) : outerClean;\n  if (ring.length < 3) return;\n  if (!isSimplePolygon(ring)) {\n    ring = outerClean;";
const replKeyhole = "  let ring = holesClean.length > 0 ? mergeHolesIntoOuterKeyhole(outerClean, holesClean) : outerClean;\n  if (ring.length < 3) return;\n  window.__c.calls++; if (holesClean.length) window.__c.withHoles++;\n  if (!isSimplePolygon(ring)) {\n    if (holesClean.length) window.__c.courtyardLost++; else window.__c.nonSimpleOuter++;\n    ring = outerClean;";
src=src.replace(targetKeyhole, replKeyhole);
src=src.replace("  const canPitch = hasPitchedRoof","  if (layerId===4||layerId===5){ if(hasPitchedRoof) window.__c.wantPitched++; }\n  const canPitch = hasPitchedRoof");
src=src.replace("  // 3. Watertight Top Roof Cap at zEaves / zRidge","  if ((layerId===4||layerId===5) && hasPitchedRoof && !canPitch) window.__c.pitchedToFlat++;\n  // 3. Watertight Top Roof Cap at zEaves / zRidge");
(0,eval)(src);
const out=[];
for (const sc of (P.get('scenes')||'').split(',').filter(Boolean)) {
  const scene=JSON.parse(getText('../cache/'+sc));
  window.__c={calls:0,withHoles:0,courtyardLost:0,nonSimpleOuter:0,wantPitched:0,pitchedToFlat:0};
  const state={cropRatio:0.88,_fetchedCropRatio:0.88,zScale:1.25,terrainScale:1.15,bedSizeMm:320,tileCols:1,tileRows:1,layerVisible:{water:true,base:true,greenery:true,roads:true,buildings:true,highlighted:true}};
  const res=buildComplete3DModel(scene,state);
  const holesIn = scene.buildings.filter(b=>b.holes && b.holes.length).length;
  out.push({scene:scene.title, buildingsWithHolesInData:holesIn, counters:window.__c});
}
document.getElementById('out').textContent='RESULT_JSON='+JSON.stringify(out);
</script></body></html>
